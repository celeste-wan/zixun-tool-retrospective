<style>
:root{--bg:#f4f7fa;--paper:#fff;--ink:#152334;--muted:#667688;--line:#dce5eb;--blue:#2374d8;--blue-soft:#e9f2ff;--violet:#7654c7;--violet-soft:#f0ebff;--teal:#0d8991;--amber:#bd7a11;--amber-soft:#fff3d8;--shadow:0 12px 30px rgba(28,58,85,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}button{font:inherit;cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:1240px;margin:0 auto;padding:30px 24px 72px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}.top h1{font-size:clamp(26px,4vw,42px);line-height:1.15;margin:8px 0 4px}.top p{margin:0;color:var(--muted);font-size:14px}.back{font-size:13px;white-space:nowrap}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;margin-top:24px}.panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}.stats{padding:18px;align-self:start}.panel-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}.panel-title .mark{width:25px;height:25px;display:grid;place-items:center;color:#fff;background:var(--teal);font-size:12px;font-weight:700}.total{margin:8px 0 16px;color:var(--muted);font-size:12px}.total strong{color:var(--ink);font-size:18px}.bars{display:grid;gap:9px}.bar-line{display:grid;grid-template-columns:100px 1fr 22px;align-items:center;gap:8px;font-size:12px}.bar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.bar-track{height:8px;background:#edf1f4;overflow:hidden}.bar-fill{height:100%;background:var(--blue);transition:width .2s}.bar-fill.project{background:var(--violet)}.bar-num{text-align:right;font-weight:700}.main{min-width:0}.tabs{display:flex;gap:5px;margin-bottom:12px}.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:13px;font-weight:600}.tab.active.game{background:var(--blue);border-color:var(--blue);color:white}.tab.active.project{background:var(--violet);border-color:var(--violet);color:white}.count{font-size:11px;padding:1px 6px;border-radius:20px;background:#eef2f5}.active .count{background:rgba(255,255,255,.24);color:#fff}.list{overflow:hidden}.list-head,.row{display:grid;grid-template-columns:92px minmax(150px,1fr) minmax(180px,auto);gap:15px;align-items:center;padding:12px 17px}.list-head{background:#f7f9fb;border-bottom:1px solid var(--line);color:#8b98a5;font-size:11px}.row{border-bottom:1px solid #edf1f3;min-height:62px;transition:background .15s}.row:hover{background:#fafcfd}.time{font-size:12px;color:#8b98a5;font-variant-numeric:tabular-nums}.identity{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}.title{font-size:13px;font-weight:700}.subtitle{font-size:12px;color:var(--muted)}.company{font-size:12px;color:var(--muted)}.tags{display:flex;justify-content:flex-end;align-items:center;gap:5px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:3px;font-size:11px;white-space:nowrap;background:var(--blue);color:#fff}.project-tag{background:var(--violet)}.model{padding:4px 7px;background:#f1f3f5;color:#617080;border:1px solid #e4e8eb;border-radius:3px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.new{padding:3px 6px;border:1px solid #edc76f;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:700;border-radius:3px}.expand{width:100%;border:0;border-top:1px solid #edf1f3;background:#fff;color:var(--muted);padding:10px;font-size:12px}.expand:hover{background:#f7f9fb;color:var(--ink)}.empty{padding:28px;color:var(--muted);font-size:13px;text-align:center}.footer{margin-top:22px;color:#8b98a5;font-size:12px;text-align:right}@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{order:2}.main{order:1}.bars{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}.back{order:-1}.list{overflow-x:auto}.list-head,.row{min-width:620px}}@media(max-width:560px){.shell{padding:22px 14px 54px}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{justify-content:center}.bars{grid-template-columns:1fr}.list-head,.row{grid-template-columns:76px minmax(160px,1fr) minmax(175px,auto);gap:10px;padding-left:12px;padding-right:12px}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="eyebrow">AI applications / 2026.07.06 weekly report</div><h1>AI 创新应用场景看板</h1><p>汇总本周 AI 游戏和服务游戏研发、运营的 AI 项目，支持按类别查看并展开全部条目。</p></div><a class="back" href="index.html">返回本周看板</a></header>
<div class="layout"><aside class="panel stats"><div class="panel-title"><span class="mark">统计</span><span>AI 应用类别统计</span></div><div id="total" class="total"></div><div id="bars" class="bars"></div></aside><section class="main"><div class="tabs" role="tablist"><button class="tab active game" data-tab="games" role="tab">AI 游戏 <span class="count" id="gameCount"></span></button><button class="tab project" data-tab="projects" role="tab">AI 项目 <span class="count" id="projectCount"></span></button></div><div class="panel list"><div class="list-head"><span>时间</span><span id="identityHead">游戏 / 类型</span><span>AI 应用</span></div><div id="rows"></div><button id="expand" class="expand"></button></div></section></div><footer class="footer">数据来源：2026.07.06 周报公开资讯整理 · 静态页面，交互在浏览器本地完成</footer>
</main>
<script>
const aiGamesData=[
{id:9,time:'2026.07.01',company:'ego studio',model:null,title:'《白之追猎》',subtitle:'狩猎动作',aiTypes:['AI代码编写','AI游戏数值策划'],isNew:true},
{id:7,time:'2026.06.30',company:'喵吉托',model:null,title:'《喵呜岛》',subtitle:'模拟经营AI陪伴',aiTypes:['AI NPC','AI美术制作'],isNew:true},

{id:1,time:'2026.06.23',company:'成都有条链接 / 深圳锦游互娱',model:null,title:'《疯狂买买买》等',subtitle:'开玉石休闲模拟',aiTypes:['AI营销素材生成'],isNew:false},
{id:6,time:'2026.06.23',company:'成都密境科技',model:null,title:'《甜甜旅行》',subtitle:'女性向合成小游戏',aiTypes:['AI美术动画制作'],isNew:false},

{id:5,time:'2026.06',company:'杭州别卡科技',model:null,title:'《人类公园》',subtitle:'AI生物模拟（在研）',aiTypes:['AI UGC'],isNew:false}
];
const aiProjectsData=[
{id:9,time:'2026.07.03',company:'上海畅指网络科技',model:null,title:'雷电游戏模拟器',aiType:'游戏模拟器内置AI功能',isNew:true},
{id:7,time:'2026.07.02',company:'三启万物',model:null,title:'Tripo 3D',aiType:'AI生成3D模型平台',isNew:true},
{id:8,time:'2026.07.01',company:'虎牙',model:'VAM-1.0',title:'虎牙游戏直播数字人VAM-1.0',aiType:'AI游戏直播数字人',isNew:true},
{id:6,time:'2026.07.01',company:'MobAI',model:null,title:'Lunaverse Stories',aiType:'AI视觉小说互动游戏平台',isNew:true},
{id:5,time:'2026.06.30',company:'喵吉托',model:null,title:'Meowa',aiType:'AI游戏开发工具',isNew:true},
{id:4,time:'2026.06.29',company:'FunPlus',model:null,title:'QA Nightly Check',aiType:'游戏QA夜间无人值守巡检系统',isNew:true},
{id:1,time:'2026.06.24',company:'影眸科技',model:null,title:'Rodin Gen-2.5',aiType:'AI生成3D模型平台',isNew:false},
{id:3,time:'2026.06',company:'元象XVERSE',model:'自研LoRA',title:'CastLoop',aiType:'AI互动影游平台',isNew:false},
{id:2,time:'2026.06',company:'库兰织梦科技',model:null,title:'Funloom AI',aiType:'AI文字模拟游戏创作平台',isNew:false}
];
let tab='games', expanded=false;
const $=s=>document.querySelector(s);
function current(){return tab==='games'?aiGamesData:aiProjectsData}
function stats(){const counts={};current().forEach(x=>{const keys=tab==='games'?x.aiTypes:[x.aiType];keys.forEach(k=>counts[k]=(counts[k]||0)+1)});return Object.entries(counts).sort((a,b)=>b[1]-a[1])}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderStats(){const list=stats(),max=list[0]?.[1]||1;$('#total').innerHTML=`共 <strong>${current().length}</strong> 项应用`;$('#bars').innerHTML=list.map(([label,count])=>`<div class="bar-line"><span class="bar-label" title="${esc(label)}">${esc(label)}</span><span class="bar-track"><span class="bar-fill ${tab==='projects'?'project':''}" style="width:${Math.round(count/max*100)}%"></span></span><span class="bar-num">${count}</span></div>`).join('')}
function renderRows(){const data=current(),shown=expanded?data:data.slice(0,3);$('#identityHead').textContent=tab==='games'?'游戏 / 类型':'项目 / 公司';$('#rows').innerHTML=shown.map(x=>{const tags=tab==='games'?x.aiTypes.map(t=>`<span class="tag">＋ ${esc(t)}</span>`).join(''):`<span class="tag project-tag">＋ ${esc(x.aiType)}</span>`;const second=tab==='games'?`<span class="subtitle">${esc(x.subtitle)}</span>`:`<span class="company">${esc(x.company)}</span>`;return `<div class="row"><span class="time">${esc(x.time)}</span><div class="identity"><span class="title">${esc(x.title)}</span>${second}${x.model?`<span class="model">${esc(x.model)}</span>`:''}${x.isNew?'<span class="new">本周新增</span>':''}</div><div class="tags">${tags}</div></div>`}).join('');const rest=data.length-3;$('#expand').textContent=expanded?'收起':`展开全部（还有 ${rest} 条）`;$('#expand').style.display=data.length>3?'block':'none'}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#gameCount').textContent=aiGamesData.length;$('#projectCount').textContent=aiProjectsData.length;renderStats();renderRows()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;expanded=false;render()}));$('#expand').addEventListener('click',()=>{expanded=!expanded;renderRows()});render();
</script>
</body></html>
